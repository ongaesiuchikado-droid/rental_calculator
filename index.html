<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>機材レンタル — カレンダー連動見積り</title>
<style>
  :root{--bg:#fff;--fg:#111;--muted:#666;--card:#fafafa}
  *{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;margin:0;color:var(--fg);background:var(--bg)}
  .wrap{max-width:1100px;margin:18px auto;padding:14px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:18px;margin:0}
  .layout{display:grid;grid-template-columns:360px 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.layout{grid-template-columns:1fr} .calendar{order:0}}
  .panel{background:var(--card);border:1px solid #eee;padding:12px;border-radius:8px}
  .calendar{min-height:360px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-cell{padding:10px;border-radius:6px;text-align:center;cursor:pointer;border:1px solid transparent}
  .cal-cell:hover{border-color:#eee}
  .cal-head{font-size:12px;color:var(--muted);padding:6px 0;text-align:center}
  .today{outline:2px solid #ddd;border-radius:6px}
  .selected{background:#111;color:#fff}
  .mark{display:inline-block;width:8px;height:8px;border-radius:50%;background:#111;margin-top:6px}
  .small{font-size:13px;color:var(--muted)}
  .btn{display:inline-block;padding:8px 10px;border-radius:8px;border:1px solid #111;background:#111;color:#fff;text-decoration:none;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--fg);border:1px solid #ddd}
  .items-list{display:grid;gap:8px;margin-top:8px;max-height:60vh;overflow:auto}
  .item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px;border:1px solid #f2f2f2;border-radius:8px;background:#fff}
  .meta{flex:1}
  .controls{display:flex;gap:6px;align-items:center}
  input[type=number]{width:64px;padding:6px;border-radius:6px;border:1px solid #ddd;text-align:center}
  select, input[type=search]{padding:8px;border-radius:6px;border:1px solid #ddd}
  .summary{margin-top:8px}
  .export{white-space:pre-wrap;border:1px dashed #ddd;padding:8px;border-radius:6px;margin-top:8px;font-size:13px;background:#fff}
  footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>機材レンタル（カレンダー連動）</h1>
      <div class="small">日付を選んで → 機材を選択 → 予約でカレンダーに印が付きます</div>
    </div>
    <div>
      <button id="goToItems" class="btn">今選べない？機材一覧へ</button>
    </div>
  </header>

  <div class="layout">
    <!-- カレンダー -->
    <div class="panel calendar" id="calendarPanel">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <button id="prev" class="btn ghost">＜</button>
          <button id="next" class="btn ghost">＞</button>
        </div>
        <div id="monthLabel" class="small"></div>
        <div>
          <button id="newBooking" class="btn ghost">予約を確認</button>
        </div>
      </div>

      <div class="cal-grid" id="calHead">
        <div class="cal-head">日</div><div class="cal-head">月</div><div class="cal-head">火</div><div class="cal-head">水</div><div class="cal-head">木</div><div class="cal-head">金</div><div class="cal-head">土</div>
      </div>

      <div class="cal-grid" id="calGrid" aria-live="polite"></div>

      <div style="margin-top:8px" class="small">選択日: <span id="selectedDate">未選択</span></div>
      <div style="margin-top:8px">
        <button id="chooseDate" class="btn" disabled>この日で機材を選ぶ</button>
        <button id="clearMarks" class="btn ghost">全予約クリア（ローカル）</button>
      </div>
    </div>

    <!-- 機材選択 -->
    <div class="panel" id="itemsPanel">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <input id="search" type="search" placeholder="検索: アンプ/マイク など" style="flex:1">
        <select id="duration" title="利用時間">
          <option value="12">12時間</option>
          <option value="24" selected>24時間</option>
        </select>
        <label class="small">会員
          <input id="member" type="checkbox" style="margin-left:6px">
        </label>
      </div>

      <div class="items-list" id="itemsList"></div>

      <div class="summary">
        <div class="small">合計: <strong id="total">¥0</strong></div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button id="confirmBooking" class="btn" disabled>予約確定してカレンダーに印を付ける</button>
          <button id="backToCal" class="btn ghost">カレンダーに戻る</button>
        </div>
        <div class="export" id="exportArea" tabindex="0" aria-label="見積り内容">見積りを生成してください。</div>
      </div>
    </div>
  </div>

  <footer>ローカル保存（ブラウザ）方式。正式予約はスタッフと確認してください。</footer>
</div>

<script>
/* ---------- データ部分（ここを丸ごと置き換え） ----------
   画像のレンタル表の内容を全て入れました。
   prices オブジェクトは 12 と 24 のみ（7day削除）
*/
const items = [

  // ===== KEYBOARD =====
  { id:"KORG-TRINITY", cat:"KEYBOARD", name:"KORG Trinity", prices:{12:6240,24:7800}, note:"シンセ" },
  { id:"HAMMOND-XB2", cat:"KEYBOARD", name:"HAMMOND XB-2", prices:{12:7680,24:9600}, note:"オルガン系" },
  { id:"KORG-SP200", cat:"KEYBOARD", name:"KORG SP-200", prices:{12:4800,24:6000}, note:"" },

  { id:"PEARL-DRUMSET", cat:"DRUM", name:"PEARL ドラムセット（シンバル含）", prices:{12:10800,24:14400}, note:"フルセット" },
  { id:"SNARE", cat:"DRUM", name:"スネア（単体）", prices:{12:1200,24:1800}, note:"" },
  { id:"TOMS", cat:"DRUM", name:"タム/フロアタム（各）", prices:{12:1800,24:2400}, note:"" },
  { id:"CYMBAL-PAIRS", cat:"DRUM", name:"シンバル各種（上下/ライド）", prices:{12:3600,24:4800}, note:"" },
  { id:"DOUBLE-PEDESTAL", cat:"DRUM", name:"ツインペダル", prices:{12:2400,24:2400}, note:"" },

  // ===== MIC =====
  { id:"SHURE-SM57", cat:"MIC", name:"SHURE SM57", prices:{12:1200,24:2400}, note:"ダイナミック" },
  { id:"SHURE-SM58", cat:"MIC", name:"SHURE SM58", prices:{12:1200,24:2400}, note:"ボーカル向け" },
  { id:"BETA-57-58", cat:"MIC", name:"SHURE BETA57 / BETA58", prices:{12:3000,24:3000}, note:"高感度" },
  { id:"WIRELESS-HAND", cat:"MIC", name:"ワイヤレスマイク（ハンド）", prices:{12:4500,24:7200}, note:"" },
  { id:"LAVALIER", cat:"MIC", name:"ピンマイク（ラベリア）", prices:{12:3600,24:4800}, note:"" },
  { id:"DI-BOX", cat:"MIC", name:"DI（BOSS等）", prices:{12:1200,24:2400}, note:"" },
  { id:"MIC-STAND", cat:"OPTION", name:"マイクスタンド（ブーム含む）", prices:{12:480,24:960}, note:"" },

  // ===== SPEAKER =====
  { id:"EV-SX300", cat:"SPEAKER", name:"EV SX300 (パワードスピーカー)", prices:{12:4800,24:6000}, note:"" },
  { id:"MEYER-UPA2P", cat:"SPEAKER", name:"MEYER UPA-2P", prices:{12:12000,24:12000}, note:"プロ機" },
  { id:"MEYER-USW1P", cat:"SPEAKER", name:"MEYER USW-1P", prices:{12:12000,24:12000}, note:"サブウーファー" },
  { id:"MONITOR-EV-FM1202", cat:"SPEAKER", name:"モニタースピーカー EV FM1202", prices:{12:4800,24:6000}, note:"" },

  // ===== OPTION / PROCESSING =====
  { id:"CANARE-CABLE", cat:"OPTION", name:"シールド（CANARE 1本）", prices:{12:360,24:720}, note:"" },
  { id:"CABLE-16CH-50M", cat:"OPTION", name:"CANARE 16ch ケーブル（50m）", prices:{12:6000,24:6000}, note:"" },
  { id:"YAMAHA-Q1031", cat:"OPTION", name:"YAMAHA Q1031（旧型）", prices:{12:3600,24:3600}, note:"" },
  { id:"KLARK-DN360", cat:"OPTION", name:"KLARK TEKNIK DN360", prices:{12:6000,24:6000}, note:"" },
  { id:"DBX-2231", cat:"OPTION", name:"DBX 2231（GEQ 2ch）", prices:{12:4800,24:4800}, note:"" },
  { id:"CD-DECK", cat:"OPTION", name:"CDデッキ", prices:{12:3600,24:3600}, note:"" },
  { id:"MD-DECK", cat:"OPTION", name:"MDデッキ", prices:{12:3600,24:3600}, note:"" },
  { id:"CASSETTE-DECK", cat:"OPTION", name:"カセットデッキ", prices:{12:3600,24:3600}, note:"" },
  { id:"COILED-CABLE", cat:"OPTION", name:"カールコード（ボーカル用）", prices:{12:1200,24:1200}, note:"" },

  // ===== MISC SMALL ITEMS =====
  { id:"DI-OTHER", cat:"OPTION", name:"各種DI（パッシブ）", prices:{12:1200,24:1200}, note:"" },
  { id:"POWER-STRIP", cat:"OPTION", name:"電源タップ（延長）", prices:{12:480,24:480}, note:"" },
  { id:"STAGE-BOARDS", cat:"OPTION", name:"舞台用ボード/足場", prices:{12:6000,24:6000}, note:"" }
];
/* ------------------------------------------------------------ */

/* state */
let state = {
  view: 'calendar', // 'calendar' or 'items'
  year: (new Date()).getFullYear(),
  month: (new Date()).getMonth(), // 0-index
  selectedDate: null, // 'YYYY-MM-DD'
  duration: 24,
  member:false,
  selections: {} // id: qty
};

const LS_KEY = 'rentalBookings_v1';

/* DOM */
const calGrid = document.getElementById('calGrid');
const monthLabel = document.getElementById('monthLabel');
const selectedDateEl = document.getElementById('selectedDate');
const chooseDateBtn = document.getElementById('chooseDate');
const itemsPanel = document.getElementById('itemsPanel');
const calendarPanel = document.getElementById('calendarPanel');
const itemsListEl = document.getElementById('itemsList');
const durationEl = document.getElementById('duration');
const memberEl = document.getElementById('member');
const totalEl = document.getElementById('total');
const exportArea = document.getElementById('exportArea');
const confirmBookingBtn = document.getElementById('confirmBooking');
const searchEl = document.getElementById('search');
const goToItemsBtn = document.getElementById('goToItems');
const backToCalBtn = document.getElementById('backToCal');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const newBookingBtn = document.getElementById('newBooking');
const clearMarksBtn = document.getElementById('clearMarks');

/* utils */
const pad = n => n < 10 ? '0'+n : n;
const ymd = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const fmt = n => '¥' + n.toLocaleString('ja-JP');
const loadBookings = () => {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch(e) { return {}; }
};
const saveBookings = (obj) => { localStorage.setItem(LS_KEY, JSON.stringify(obj)); };

/* calendar render */
function renderCalendar(){
  calGrid.innerHTML = '';
  const y = state.year, m = state.month;
  monthLabel.textContent = `${y}年 ${m+1}月`;
  const first = new Date(y,m,1);
  const startDay = first.getDay(); // 0..6
  const days = new Date(y, m+1, 0).getDate();
  // fill blanks
  for(let i=0;i<startDay;i++){
    const blank = document.createElement('div');
    blank.className = 'cal-cell';
    calGrid.appendChild(blank);
  }
  const bookings = loadBookings();
  for(let d=1; d<=days; d++){
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    const dayNum = document.createElement('div');
    dayNum.textContent = d;
    cell.appendChild(dayNum);

    const dateKey = ymd(y,m,d);
    // mark
    if (bookings[dateKey]){
      const mark = document.createElement('div');
      mark.className = 'mark';
      cell.appendChild(mark);
    }
    // highlight today
    const today = new Date();
    if (y===today.getFullYear() && m===today.getMonth() && d===today.getDate()){
      cell.classList.add('today');
    }
    // selected
    if (state.selectedDate === dateKey){
      cell.classList.add('selected');
    }
    cell.addEventListener('click', ()=>{
      state.selectedDate = dateKey;
      selectedDateEl.textContent = dateKey;
      chooseDateBtn.disabled = false;
      renderCalendar();
    });
    cell.addEventListener('dblclick', ()=>{
      // show bookings for that day
      showBookingsFor(dateKey);
    });
    calGrid.appendChild(cell);
  }
}

/* show bookings modal-like (simple) */
function showBookingsFor(dateKey){
  const bookings = loadBookings();
  const entry = bookings[dateKey];
  if (!entry){
    alert(dateKey + " の予約はありません。");
    return;
  }
  let txt = `予約日: ${dateKey}\n作成: ${new Date(entry.meta.createdAt).toLocaleString()}\n\n`;
  txt += '--- 機材 ---\n';
  entry.items.forEach((it, idx) => {
    txt += `${idx+1}. ${it.name} × ${it.qty} (単価 ${fmt(it.unit)}) → ${fmt(it.subtotal)}\n`;
  });
  txt += `\n合計: ${fmt(entry.total)}\n会員: ${entry.meta.member ? 'あり' : 'なし'}\n利用時間: ${entry.meta.durationLabel}\n\n備考: ローカル保存データです。正式予約はスタッフ確認を。`;
  alert(txt);
}

/* navigate month */
prevBtn.addEventListener('click', ()=>{
  state.month -= 1;
  if (state.month < 0){ state.month = 11; state.year -= 1; }
  renderCalendar();
});
nextBtn.addEventListener('click', ()=>{
  state.month += 1;
  if (state.month > 11){ state.month = 0; state.year += 1; }
  renderCalendar();
});

/* initial */
renderCalendar();

/* choose date -> items view */
chooseDateBtn.addEventListener('click', ()=>{
  if (!state.selectedDate) return;
  showItemsView();
});

/* go to items directly */
goToItemsBtn.addEventListener('click', ()=> {
  if (!state.selectedDate && !confirm('日付を先に選ぶのがおすすめです。日付未選択で続けますか？')) return;
  showItemsView();
});

backToCalBtn.addEventListener('click', ()=> {
  state.view = 'calendar';
  renderView();
  renderCalendar();
});

/* render items list */
function renderItemsList(){
  itemsListEl.innerHTML = '';
  const q = (searchEl.value||'').trim().toLowerCase();
  items.forEach(it=>{
    if (q && !( (it.name||'') + (it.cat||'') + (it.note||'') ).toLowerCase().includes(q)) return;
    const row = document.createElement('div');
    row.className = 'item';
    row.innerHTML = `
      <div class="meta">
        <div style="font-weight:600">${it.name}</div>
        <div class="small">${it.cat} ${it.note||''}</div>
        <div class="small">料金: 12h ${fmt(it.prices[12]||0)} / 24h ${fmt(it.prices[24]||0)}</div>
      </div>
      <div class="controls">
        <input type="number" min="0" value="${state.selections[it.id]||0}" data-id="${it.id}" class="qty">
        <input type="checkbox" ${state.selections[it.id] ? 'checked' : ''} data-id="${it.id}" class="chk">
      </div>
    `;
    const qty = row.querySelector('.qty');
    const chk = row.querySelector('.chk');
    qty.addEventListener('input', (e)=>{
      let v = parseInt(e.target.value)||0;
      if (v <= 0){ delete state.selections[it.id]; chk.checked = false; e.target.value = 0; }
      else { state.selections[it.id] = v; chk.checked = true; }
      updateTotal();
    });
    chk.addEventListener('change', (e)=>{
      if (e.target.checked){
        if (!state.selections[it.id] || state.selections[it.id]===0){ state.selections[it.id]=1; qty.value = 1; }
      } else {
        delete state.selections[it.id]; qty.value = 0;
      }
      updateTotal();
    });
    itemsListEl.appendChild(row);
  });
  updateTotal();
}

/* update total */
function updateTotal(){
  state.duration = parseInt(durationEl.value);
  state.member = memberEl.checked;
  let sum = 0;
  for (const [id, qty] of Object.entries(state.selections)){
    const it = items.find(x=>x.id===id);
    if (!it) continue;
    const unit = (it.prices && it.prices[state.duration]) ? it.prices[state.duration] : 0;
    sum += unit * qty;
  }
  if (state.member) sum = Math.round(sum * 0.9);
  totalEl.textContent = fmt(sum);
  exportArea.textContent = generateEstimateText(sum);
  confirmBookingBtn.disabled = Object.keys(state.selections).length === 0 || !state.selectedDate;
}

/* estimate text */
function generateEstimateText(total){
  const durLabel = state.duration===12 ? '12時間' : '24時間';
  let lines = [];
  lines.push('見積り（暫定）');
  lines.push(`対象日: ${state.selectedDate || '未選択'}`);
  lines.push(`利用時間: ${durLabel}`);
  lines.push(`会員: ${state.member ? 'あり (10%OFF)' : 'なし'}`);
  lines.push('');
  lines.push('--- 機材 ---');
  let idx=1;
  for (const [id,qty] of Object.entries(state.selections)){
    const it = items.find(x=>x.id===id); if(!it) continue;
    const unit = (it.prices && it.prices[state.duration]) ? it.prices[state.duration] : 0;
    lines.push(`${idx}. ${it.name} × ${qty} 単価 ${fmt(unit)} 小計 ${fmt(unit*qty)}`);
    idx++;
  }
  lines.push('');
  lines.push(`合計（概算）: ${fmt(total)}`);
  lines.push('');
  lines.push('※ 在庫・確保はスタッフ確認をお願いします。');
  return lines.join('\n');
}

/* confirm booking -> save to localStorage and mark calendar */
confirmBookingBtn.addEventListener('click', ()=>{
  if (!state.selectedDate){
    alert('先に日付を選んでください。');
    return;
  }
  const bookings = loadBookings();
  const durLabel = state.duration===12 ? '12時間' : '24時間';
  // build items array
  const sel = [];
  let total = 0;
  for (const [id,qty] of Object.entries(state.selections)){
    const it = items.find(x=>x.id===id); if(!it) continue;
    const unit = (it.prices && it.prices[state.duration]) ? it.prices[state.duration] : 0;
    sel.push({ id: it.id, name: it.name, qty, unit, subtotal: unit*qty });
    total += unit * qty;
  }
  if (state.member) total = Math.round(total * 0.9);
  bookings[state.selectedDate] = {
    meta: { createdAt: Date.now(), member: state.member, duration: state.duration, durationLabel: durLabel },
    items: sel,
    total
  };
  saveBookings(bookings);
  alert(state.selectedDate + ' に予約を保存しました（ローカル）。カレンダーに印が付きます。');
  // reset selections
  state.selections = {};
  renderCalendar();
  renderView();
});

/* helper - show items view */
function showItemsView(){
  state.view = 'items';
  renderView();
  renderItemsList();
}

/* view switch */
function renderView(){
  if (state.view === 'calendar'){
    calendarPanel.style.display = '';
    itemsPanel.style.display = '';
  } else {
    calendarPanel.style.display = '';
    itemsPanel.style.display = '';
    setTimeout(()=> itemsPanel.scrollIntoView({behavior:'smooth'}),100);
  }
}

/* search/duration/member listeners */
searchEl.addEventListener('input', ()=> renderItemsList());
durationEl.addEventListener('change', updateTotal);
memberEl.addEventListener('change', updateTotal);

/* back button and nav */
backToCalBtn.addEventListener('click', ()=> {
  state.view='calendar'; renderView(); renderCalendar();
});
goToItemsBtn.addEventListener('click', ()=> {
  if (!state.selectedDate && !confirm('日付を選ばずに続けますか？（後で日付を選べます）')) return;
  showItemsView();
});

/* quick view: clicking existing mark shows booking */
newBookingBtn.addEventListener('click', ()=> {
  if (!state.selectedDate) { alert('日付を選んでください（カレンダーをクリック）'); return; }
  showBookingsFor(state.selectedDate);
});

/* clear all marks (local only) */
clearMarksBtn.addEventListener('click', ()=> {
  if (!confirm('ローカル保存された予約を全て消します。よいですか？')) return;
  localStorage.removeItem(LS_KEY);
  renderCalendar();
});

/* startup */
renderView();
renderCalendar();
updateTotal();

</script>
</body>
</html>
